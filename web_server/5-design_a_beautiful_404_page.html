<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Somewhere Beyond Reality</title>

    <style>
        /* Basic page styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #f4e8d8;
            font-family: Arial, Helvetica, sans-serif;
            color: #302c42;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Main content */
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
            position: relative;
        }

        /* Top label */
        .label {
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        /* 404 number */
        h1 {
            font-size: clamp(100px, 20vw, 190px);
            line-height: 1;
            font-weight: 900;
            color: #302c42;
            letter-spacing: -10px;
        }

        /* Pipe illustration */
        .pipe {
            width: 180px;
            height: 180px;
            margin: -5px auto 20px;
            animation: float 3s ease-in-out infinite;
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-18px) rotate(5deg);
            }
        }

        /* Main heading */
        h2 {
            font-family: Georgia, serif;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: normal;
            margin-bottom: 12px;
        }

        /* Description */
        .description {
            font-size: 15px;
            line-height: 1.7;
            max-width: 420px;
            margin: 0 auto 25px;
            color: #766b68;
        }

        /* Home button */
        .home-button {
            display: inline-block;
            padding: 14px 30px;
            background: #302c42;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .home-button:hover {
            background: #d58c59;
            color: white;
            transform: translateY(-3px);
        }

        /* Decorative clouds */
        .cloud {
            position: fixed;
            width: 130px;
            height: 45px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 50px;
            z-index: -1;
        }

        .cloud::before,
        .cloud::after {
            content: "";
            position: absolute;
            background: inherit;
            border-radius: 50%;
        }

        .cloud::before {
            width: 60px;
            height: 60px;
            top: -25px;
            left: 20px;
        }

        .cloud::after {
            width: 45px;
            height: 45px;
            top: -15px;
            right: 20px;
        }

        .cloud-one {
            top: 15%;
            left: 10%;
        }

        .cloud-two {
            bottom: 15%;
            right: 10%;
            transform: scale(1.3);
        }

        /* Footer */
        footer {
            margin-top: 45px;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.6;
        }

        /* Mobile responsive design */
        @media (max-width: 600px) {

            h1 {
                letter-spacing: -5px;
            }

            .pipe {
                width: 140px;
                height: 140px;
            }

            .cloud-one {
                left: -50px;
            }

            .cloud-two {
                right: -50px;
            }

            footer {
                margin-top: 30px;
            }
        }

    </style>
</head>

<body>

    <!-- Background clouds -->
    <div class="cloud cloud-one"></div>
    <div class="cloud cloud-two"></div>

    <main class="container">

        <p class="label">Somewhere beyond reality</p>

        <h1>404</h1>

        <!-- Pipe illustration using SVG -->
        <div class="pipe">

            <svg viewBox="0 0 200 200"
                 width="100%"
                 height="100%"
                 xmlns="http://www.w3.org/2000/svg">

                <!-- Pipe shadow -->
                <ellipse cx="100" cy="165" rx="65" ry="10"
                         fill="#766b68" opacity="0.2"/>

                <!-- Pipe bowl -->
                <path d="M45 85 Q45 65 65 65 L115 65
                         Q135 65 135 85 L135 120
                         Q135 150 90 150
                         Q45 150 45 120 Z"
                      fill="#d58c59"
                      stroke="#302c42"
                      stroke-width="5"/>

                <!-- Pipe opening -->
                <ellipse cx="90" cy="68" rx="45" ry="13"
                         fill="#302c42"/>

                <ellipse cx="90" cy="68" rx="35" ry="8"
                         fill="#766b68"/>

                <!-- Pipe stem -->
                <path d="M125 100 L175 100
                         Q185 100 185 110
                         L185 115 Q185 125 175 125
                         L125 125"
                      fill="#d58c59"
                      stroke="#302c42"
                      stroke-width="5"/>

                <!-- Pipe highlight -->
                <path d="M58 92 L58 115"
                      stroke="#f4c98d"
                      stroke-width="5"
                      stroke-linecap="round"/>

            </svg>

        </div>

        <h2>Ceci n'est pas une page</h2>

        <p class="description">
            Oops! This page has gone on an adventure
            without leaving an address. Let's get you
            somewhere that actually exists.
        </p>

        <a href="/" class="home-button">Take me home</a>

    </main>

</body>
</html>
